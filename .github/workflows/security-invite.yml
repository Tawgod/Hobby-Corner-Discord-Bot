name: Hobby Bot security invitation candidate
on:
  push:
    branches: [feature/security-enrollment-invites-20261102]
  pull_request:
    paths:
      - 'security_invite.py'
      - 'main.py'
      - 'tests/test_security_invite.py'
      - '.github/workflows/security-invite.yml'
permissions:
  contents: read
jobs:
  security-invite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bot and invitation syntax
        run: python -m py_compile main.py security_invite.py
      - name: Discord role and private invitation transport tests
        run: python -m unittest discover -s tests -p 'test_security_invite.py' -v
